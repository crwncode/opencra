name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - name: Sync
        run: uv sync --all-packages --group dev
      - name: Ruff
        run: uv run ruff check packages apps tests
      - name: Tests
        run: uv run pytest
      - name: Mypy
        run: uv run mypy packages/shared/opencra_shared packages/cli/opencra_cli apps/api/opencra_api
