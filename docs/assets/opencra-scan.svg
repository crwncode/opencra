<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" role="img" aria-label="Terminal demo of opencra scan .">
  <defs>
    <style>
      .term { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 13px; }
      .dim { fill: #8b95a8; }
      .cmd { fill: #e6edf3; }
      .green { fill: #3fb950; }
      .cyan { fill: #79c0ff; }
      .red { fill: #ff7b72; }
      .white { fill: #e6edf3; }
      .prompt { fill: #7ee787; }
      .line { opacity: 0; animation: fadein 0.18s ease-out forwards; }
      @keyframes fadein { to { opacity: 1; } }
    </style>
  </defs>
  <rect width="760" height="420" rx="12" fill="#0d1117" stroke="#30363d"/>
  <rect width="760" height="36" rx="12" fill="#161b22"/>
  <rect y="24" width="760" height="12" fill="#161b22"/>
  <circle cx="22" cy="18" r="6" fill="#ff5f57"/>
  <circle cx="42" cy="18" r="6" fill="#febc2e"/>
  <circle cx="62" cy="18" r="6" fill="#28c840"/>
  <text x="380" y="22" text-anchor="middle" class="term dim" font-size="12">opencra scan .</text>

  <text class="term line" style="animation-delay:0.1s" x="20" y="64"><tspan class="prompt">$</tspan><tspan class="cmd"> uvx opencra scan .</tspan></text>
  <text class="term line white" style="animation-delay:0.45s" x="20" y="92">OpenCRA scan of .</text>
  <text class="term line dim" style="animation-delay:0.6s" x="20" y="112">A KEV match is a CRA candidate, not legal awareness.</text>
  <text class="term line" style="animation-delay:0.8s" x="20" y="140">
    <tspan class="white">Components: 128  Matches: 3  </tspan>
    <tspan class="white">KEV hits: 0</tspan>
  </text>

  <text class="term line dim" style="animation-delay:1.0s" x="20" y="172">Package          Version   ID                 Severity   KEV   Action</text>
  <text class="term line white" style="animation-delay:1.15s" x="20" y="192">requests         2.32.3    GHSA-xxxx          MEDIUM           Triage</text>
  <text class="term line white" style="animation-delay:1.3s" x="20" y="212">jinja2           3.1.4     CVE-2024-xxxxx     HIGH             Triage</text>
  <text class="term line" style="animation-delay:1.45s" x="20" y="232">
    <tspan class="white">cryptography     42.0.5    CVE-2024-xxxxx     </tspan>
    <tspan class="red">CRITICAL</tspan>
    <tspan class="white">          Triage</tspan>
  </text>

  <text class="term line" style="animation-delay:1.75s" x="20" y="272">
    <tspan class="green">[+]</tspan>
    <tspan class="white"> Scan complete: 1 critical vulnerability found.</tspan>
  </text>
  <text class="term line" style="animation-delay:2.0s" x="20" y="296">
    <tspan class="cyan">[i]</tspan>
    <tspan class="white"> Need automated 24h/72h ENISA/CSIRT audit reporting?</tspan>
  </text>
  <text class="term line white" style="animation-delay:2.15s" x="20" y="316">    Run with --sync-cloud or visit https://cra-shield.com</text>

  <text class="term line prompt" style="animation-delay:2.5s" x="20" y="356">$</text>
</svg>
