[project]
name = "opencra-api"
version = "0.1.0"
description = "Optional local FastAPI control plane."
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
  "opencra-shared",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy>=2.0",
  "alembic>=1.14",
  "pydantic-settings>=2.6",
  "pyjwt[crypto]>=2.10",
  "stripe>=11.0",
  "jinja2>=3.1",
  "httpx>=0.27",
  "python-multipart>=0.0.12",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]
pdf = ["weasyprint>=63.0"]

[project.scripts]
opencra-api = "opencra_api.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["opencra_api"]
