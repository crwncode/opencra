[project]
name = "opencra"
version = "0.1.4"
description = "CRA Article 14 reporting readiness for your SBOM — know which vulnerabilities start a 24-hour clock."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "CodeLancaster" }]
keywords = [
  "cra",
  "cyber-resilience-act",
  "sbom",
  "cyclonedx",
  "osv",
  "cisa-kev",
  "compliance",
  "devsecops",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "Environment :: Console",
]
dependencies = [
  "opencra-cli>=0.1.4",
]

[project.urls]
Homepage = "https://github.com/crwncode/opencra"
Issues = "https://github.com/crwncode/opencra/issues"

[project.scripts]
opencra = "opencra_cli.app:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Meta-package: the `opencra` console script lives in opencra-cli.
# Keep the sdist tiny so `uv build` at the workspace root does not ship the monorepo.
[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.hatch.build.targets.sdist]
only-include = [
  "README.md",
  "LICENSE",
]

[tool.uv.workspace]
members = ["packages/shared", "packages/cli", "apps/api"]

[tool.uv.sources]
opencra-shared = { workspace = true }
opencra-cli = { workspace = true }
opencra-api = { workspace = true }

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.8",
  "mypy>=1.13",
  "httpx>=0.27",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["packages", "apps", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
  "B008",   # FastAPI Depends() in defaults is the framework idiom
  "UP017",  # datetime.timezone.utc is explicit and fine
  "UP042",  # str, Enum is compatible with Typer/Pydantic
  "E501",   # line length enforced lightly; prefer readable API signatures
]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
warn_unused_ignores = false
explicit_package_bases = true
mypy_path = "packages/shared:packages/cli:apps/api"
packages = ["opencra_shared", "opencra_cli", "opencra_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["packages/shared", "packages/cli", "apps/api"]
markers = [
  "network: live network tests (skipped unless OPENCRA_NETWORK_TESTS=1)",
]
