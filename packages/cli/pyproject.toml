[project]
name = "opencra-cli"
version = "0.1.0"
description = "OpenCRA command-line scanner — Syft wrapper, OSV + CISA KEV matching."
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
  "opencra-shared",
  "typer>=0.15",
  "rich>=13.9",
  "httpx>=0.27",
  "jinja2>=3.1",
]

[project.optional-dependencies]
pdf = ["weasyprint>=63.0"]

[project.scripts]
opencra = "opencra_cli.app:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["opencra_cli"]
