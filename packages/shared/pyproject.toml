[project]
name = "opencra-shared"
version = "0.1.6"
description = "Shared Pydantic models, CycloneDX subset, and CRA clock calculators."
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
  "pydantic>=2.9",
  "packageurl-python>=0.16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["opencra_shared"]
