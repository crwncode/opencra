name: OpenCRA
description: Add EU Cyber Resilience Act (CRA) checks in 3 lines — SBOM, OSV, and CISA KEV.
author: CodeLancaster
branding:
  icon: shield
  color: red
inputs:
  target:
    description: Syft scan target (directory, image, or CycloneDX JSON)
    required: false
    default: "."
  fail-on:
    description: none | kev | critical | high
    required: false
    default: kev
  fail-on-cve:
    description: When true, fail the job on CISA KEV hits (same as fail-on: kev).
    required: false
    default: "false"
  format:
    description: table | json | cyclonedx | spdx
    required: false
    default: table
  export-pdf:
    description: Path for a community PDF (or HTML fallback)
    required: false
    default: ""
  offline:
    description: Use cached KEV/OSV only
    required: false
    default: "false"
  sync-cloud:
    description: POST results to OPENCRA_API_URL when OPENCRA_API_KEY is set
    required: false
    default: "false"
  syft-version:
    description: Syft version to install when missing
    required: false
    default: "v1.18.1"
runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install Syft
      shell: bash
      run: |
        if ! command -v syft >/dev/null 2>&1; then
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh \
            | sh -s -- -b "${RUNNER_TEMP}/bin" "${{ inputs.syft-version }}"
          echo "${RUNNER_TEMP}/bin" >> "$GITHUB_PATH"
        fi
    - name: Install OpenCRA
      shell: bash
      run: pip install "${{ github.action_path }}/../shared" "${{ github.action_path }}/../cli"
    - name: Scan
      shell: bash
      run: |
        FAIL_ON="${{ inputs.fail-on }}"
        if [ "${{ inputs.fail-on-cve }}" = "true" ] && [ "$FAIL_ON" = "none" ]; then
          FAIL_ON="kev"
        fi
        EXTRA=()
        if [ -n "${{ inputs.export-pdf }}" ]; then
          EXTRA+=(--export-pdf "${{ inputs.export-pdf }}")
        fi
        if [ "${{ inputs.offline }}" = "true" ]; then
          EXTRA+=(--offline)
        fi
        if [ "${{ inputs.sync-cloud }}" = "true" ]; then
          EXTRA+=(--sync-cloud)
        fi
        opencra scan "${{ inputs.target }}" \
          --format "${{ inputs.format }}" \
          --fail-on "${FAIL_ON}" \
          "${EXTRA[@]}"
